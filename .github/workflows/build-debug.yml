name: Build Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Termux Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTermuxDebug --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          find app/build/outputs/apk/termux/debug -name "*.apk" -exec cp {} output/ \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antiGem-termux-debug-apk
          path: output/*.apk
          if-no-files-found: error